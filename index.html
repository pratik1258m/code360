<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CadetPath 360 — the complete NCC preparation system: syllabus and lessons for Certificates A, B and C, a map reading lab, timed exam papers, practical drill and first aid, and Cadet AI."
    />
    <meta name="theme-color" content="#3a5636" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before first paint, so nothing flashes.
      (() => {
        try {
          const saved = localStorage.getItem('cadetpath.theme')
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5636'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f6f5ec' stroke-width='1.6'/%3E%3Cpath d='m19.6 12.4-2 5.2-5.2 2 2-5.2z' fill='%23f6f5ec'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.json" />
    <title>CadetPath 360 · NCC preparation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
